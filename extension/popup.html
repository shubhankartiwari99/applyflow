<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StratumApply</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 320px;
      background: #0b0f17;
      color: #ffffff;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00e599;
      box-shadow: 0 0 10px #00e599;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ffffff;
    }

    .status-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      background: rgba(0, 229, 153, 0.15);
      color: #00e599;
      border: 1px solid rgba(0, 229, 153, 0.3);
    }

    .status-badge.offline {
      background: rgba(244, 63, 94, 0.15);
      color: #f43f5e;
      border-color: rgba(244, 63, 94, 0.3);
    }

    .card {
      background: #111622;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .job-title {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.3;
    }

    .job-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 3px;
    }

    .btn {
      width: 100%;
      height: 34px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      outline: none;
      margin-top: 10px;
    }

    .btn-primary {
      background: #00e599;
      color: #070a0f;
    }

    .btn-primary:hover {
      background: #00c784;
      box-shadow: 0 0 14px rgba(0, 229, 153, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .settings-section {
      margin-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 10px;
    }

    .label {
      font-size: 11px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }

    .input {
      width: 100%;
      height: 30px;
      background: #070a0f;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #ffffff;
      padding: 0 8px;
      font-size: 11px;
      outline: none;
    }

    .input:focus {
      border-color: #00e599;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 11px;
    }

    .link {
      color: #00e599;
      text-decoration: none;
      cursor: pointer;
    }

    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">StratumApply</span>
    </div>
    <span id="conn-badge" class="status-badge">Checking…</span>
  </div>

  <div class="card" id="job-card">
    <div class="card-title">Active Job on Page</div>
    <div id="job-role" class="job-title">No job detected</div>
    <div id="job-company" class="job-sub">Open LinkedIn or Handshake to capture postings</div>
    <button id="capture-btn" class="btn btn-primary" style="display: none;">
      ⚡ Capture to Pipeline
    </button>
  </div>

  <div class="settings-section">
    <label class="label" for="server-url">StratumApply App URL</label>
    <div style="display: flex; gap: 6px;">
      <input type="text" id="server-url" class="input" placeholder="http://localhost:3000" />
      <button id="save-settings-btn" class="btn btn-secondary" style="width: 60px; margin-top: 0; height: 30px; font-size: 11px;">
        Save
      </button>
    </div>
  </div>

  <div class="footer">
    <span id="job-count" style="color: #64748b;">Pipeline sync ready</span>
    <a id="dashboard-link" class="link">Open Dashboard ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
